# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    gatewayUrl:
      type: string
      default: "https://m2mfreedom.com"
      description: "Freedom Engine Gateway Base URL"
    authHeader:
      type: string
      default: ""
      description: "Optional L402 or x402 Authorization token for paid tools"
commandFunction: |
  (config) => ({
    command: 'node',
    args: ['./index.js'],
    env: {
      FREEDOM_GATEWAY_URL: config.gatewayUrl || 'https://m2mfreedom.com',
      FREEDOM_AUTH_HEADER: config.authHeader || ''
    }
  })
